# 사이트 기본 정보 — 홈 화면 내용은 _data/profile.yml 에서 수정
title: 서현원
tagline: Backend Developer
description: 백엔드 개발자 서현원의 포트폴리오와 기술 블로그. 운영 장애 추적, 성능 개선, 사이드 프로젝트 기록.
url: https://viroovr.github.io
baseurl: ""
lang: ko
timezone: Asia/Seoul

author:
  name: 서현원
  email: tjgusdnjs789@gmail.com
github_username: viroovr

social:
  name: 서현원
  links:
    - https://github.com/viroovr

blog_title: 문제를 원인까지 추적한 기록

permalink: /blog/:year/:title/

collections:
  projects:
    output: true
    permalink: /projects/:path/

defaults:
  - scope: { path: "" }
    values: { image: /assets/img/my_pic.jpg }   # 링크 미리보기 기본 이미지
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "", type: projects }
    values: { layout: page }

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: highlight

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

feed:
  path: feed.xml

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
