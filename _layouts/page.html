---
layout: default
---
<article class="article">
  <header class="article-head">
    {%- if page.collection == "projects" %}<a class="back" href="{{ '/projects/' | relative_url }}">← 프로젝트</a>{% endif %}
    <h1>{{ page.title }}</h1>
    {%- if page.description %}<p class="lead">{{ page.description }}</p>{% endif %}
    {% include stack.html items=page.stack %}
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
