<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav class="nav" aria-label="주요 메뉴">
      {%- assign p = page.url -%}
      <a href="{{ '/blog/' | relative_url }}" {% if p contains '/blog/' %}aria-current="page"{% endif %}>블로그</a>
      <a href="{{ '/projects/' | relative_url }}" {% if p contains '/projects/' %}aria-current="page"{% endif %}>프로젝트</a>
      <button class="theme-toggle" type="button" aria-label="다크 모드 전환" title="다크 모드 전환">
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </nav>
  </div>
</header>
