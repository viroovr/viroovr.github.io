{%- assign project = include.project -%}
<a class="card" href="{{ project.url | relative_url }}">
  {%- if project.img %}
  <img class="card-img" src="{{ project.img | relative_url }}" alt="" loading="lazy">
  {%- endif %}
  <div class="card-body">
    <h3>{{ project.title }}</h3>
    <p>{{ project.description }}</p>
    {% include stack.html items=project.stack %}
  </div>
</a>
